<style>
@font-face { font-family: "Ongleip Yoontang"; src: url("/fonts/OngleipYoontang.ttf") format("truetype"); font-display: swap; size-adjust: 108%; }
@font-face { font-family: "Cafe24 Ssurround"; src: url("/fonts/Cafe24Ssurround.woff2") format("woff2"), url("/fonts/Cafe24Ssurround.woff") format("woff"); font-display: swap; }
/* Layout: 단색 핑크 헤더 → 두 달 달력이 나란히 + 오른쪽에 고른 날의 일정 카드 (좁으면 차례로 쌓임). */
:root {
  --bg: #fff3f7;               /* 연한 벚꽃 바탕 */
  --surface: #ffffff;
  --surface-2: #fff7fa;
  --line: #ffdce8;
  --fg: #4a2236;               /* 딥 로즈 글자 */
  --muted: #a7728a;
  --pink: #ff5c97;             /* 메인 핫핑크 */
  --pink-2: #ff8db8;
  --pink-3: #ffc2d8;
  --pink-soft: #ffe6ef;
  --pink-ink: #ffffff;
  --dad: #6f86ff;  --dad-soft: #e8ecff;
  --mom: #ff4f8b;  --mom-soft: #ffe2ed;
  --romi: #ff9a5a; --romi-soft: #fff0e4;
  --fam: #b06cf0;  --fam-soft: #f4e8ff;
  --red: #e8343f;
  --jp-ink: #ffffff;
  --sat: #6f86ff;
  --head: #ff6b9f;              /* 상단바 단색 */
  --a1: #2a78d6; --a2: #eb6834; --a3: #1baf7a; --a4: #eda100; --a5: #e87ba4; --a6: #008300; /* 자산 종류 (검증 통과) */
  --bar-ink: #ffffff;
  --fixed: #c2255c;            /* 가계부: 고정비 (검증: 라이트·다크 모두 통과) */
  --fixed-soft: #fde3ec;
  --var: #8c7bff;              /* 가계부: 변동 지출 */
  --var-soft: #ece9ff;
  --var-ink: #5a48d6;
  /* 가계부 분류 색: 분류마다 색상(--h)만 다르고, 밝기·채도는 여기서 정한다 (파스텔) */
  --cat-s: 85%; --cat-l: 94%; --cat-l-hover: 90%; --cat-bar-s: 72%; --cat-bar-l: 72%;
  --shadow: 0 18px 40px -12px rgba(255, 92, 151, .35);
  --card: 0 2px 0 rgba(255, 92, 151, .08), 0 12px 28px -18px rgba(255, 92, 151, .45);
  --f-title: "Cafe24 Ssurround", "Ongleip Yoontang", "Noto Sans KR", system-ui, sans-serif;
  --f-display: "Ongleip Yoontang", "Noto Sans KR", system-ui, sans-serif;
  --f-cute: "Ongleip Yoontang", "Noto Sans KR", system-ui, sans-serif;
  --f-body: "Ongleip Yoontang", "Noto Sans KR", system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1f1219; --surface: #2a1822; --surface-2: #321d29; --line: #47283a;
    --fg: #ffe9f1; --muted: #c995ac; --pink: #ff76a8; --pink-2: #ff9cc2; --pink-3: #7a3556; --pink-soft: #46213a; --pink-ink: #2a0d1b;
    --dad: #98a8ff; --dad-soft: #262c52; --mom: #ff7fab; --mom-soft: #4b2236;
    --romi: #ffb07f; --romi-soft: #4a2c1d; --fam: #cb98ff; --fam-soft: #3a2550;
    --red: #ff5a63; --jp-ink: #ffffff; --sat: #98a8ff; --head: #c9497c; --bar-ink: #2a0d1b;
    --fixed: #e64980; --fixed-soft: #4a1f30; --var: #8174f0; --var-soft: #2c2752; --var-ink: #b9b0ff;
    --cat-s: 30%; --cat-l: 21%; --cat-l-hover: 25%; --cat-bar-s: 55%; --cat-bar-l: 62%;
    --a1: #3987e5; --a2: #d95926; --a3: #199e70; --a4: #c98500; --a5: #d55181; --a6: #008300;
    --shadow: 0 18px 40px -12px rgba(0,0,0,.6); --card: 0 12px 28px -18px rgba(0,0,0,.7);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1f1219; --surface: #2a1822; --surface-2: #321d29; --line: #47283a;
  --fg: #ffe9f1; --muted: #c995ac; --pink: #ff76a8; --pink-2: #ff9cc2; --pink-3: #7a3556; --pink-soft: #46213a; --pink-ink: #2a0d1b;
  --dad: #98a8ff; --dad-soft: #262c52; --mom: #ff7fab; --mom-soft: #4b2236;
  --romi: #ffb07f; --romi-soft: #4a2c1d; --fam: #cb98ff; --fam-soft: #3a2550;
  --red: #ff5a63; --jp-ink: #ffffff; --sat: #98a8ff; --head: #c9497c; --bar-ink: #2a0d1b;
    --fixed: #e64980; --fixed-soft: #4a1f30; --var: #8174f0; --var-soft: #2c2752; --var-ink: #b9b0ff;
    --cat-s: 30%; --cat-l: 21%; --cat-l-hover: 25%; --cat-bar-s: 55%; --cat-bar-l: 62%;
    --a1: #3987e5; --a2: #d95926; --a3: #199e70; --a4: #c98500; --a5: #d55181; --a6: #008300;
  --shadow: 0 18px 40px -12px rgba(0,0,0,.6); --card: 0 12px 28px -18px rgba(0,0,0,.7);
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); -webkit-text-size-adjust: 100%; }
body { margin: 0; }
img { max-width: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 14px; line-height: 1.5; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--head); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2.5px solid var(--pink); outline-offset: 2px; }

.wrap { max-width: 1480px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* ---------- 헤더 ---------- */
header.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--head);
  color: #fff;
  border-radius: 0 0 28px 28px;
  box-shadow: 0 10px 24px -16px rgba(180, 30, 90, .6);
}
.top-row { display: flex; align-items: center; gap: 12px 16px; flex-wrap: wrap; padding-block: 16px 10px; }
.brand { font-family: var(--f-title); font-weight: 400; font-size: 32px; line-height: 1; display: flex; align-items: center; gap: 10px; margin: 0; }
.face { width: 52px; height: 52px; border-radius: 50%; background: #fff url("/img/romi-face.png") center / cover no-repeat; border: 3px solid #fff; position: relative; flex: none; box-shadow: 0 3px 0 rgba(180, 30, 90, .25); }
.brand .sub { font-family: var(--f-cute); font-size: 13px; font-weight: 700; background: #fff; color: var(--pink); padding: 4px 11px; border-radius: 999px; text-shadow: none; transform: rotate(-3deg); box-shadow: 0 2px 0 rgba(180, 30, 90, .2); }

.monthnav { display: flex; align-items: center; gap: 8px; margin-left: auto; }
.iconbtn { width: 40px; height: 40px; border-radius: 50%; border: 0; background: #fff; color: var(--pink); display: grid; place-items: center; font-size: 22px; font-weight: 700; line-height: 1; box-shadow: 0 3px 0 rgba(180, 30, 90, .25); transition: transform .12s; }
.iconbtn:hover { transform: translateY(-2px); }
.iconbtn:active { transform: translateY(1px); box-shadow: none; }
.textbtn { height: 40px; padding: 0 18px; border-radius: 999px; border: 2px solid #fff; background: transparent; color: #fff; font-family: var(--f-display); font-size: 16px; transition: background .12s; }
.textbtn:hover { background: rgba(255,255,255,.2); }

.filters { display: flex; gap: 8px; flex-wrap: wrap; padding-bottom: 16px; align-items: center; }
.chip { display: inline-flex; align-items: center; gap: 7px; height: 34px; padding: 0 15px 0 11px; border-radius: 999px; border: 2px solid transparent; background: rgba(255,255,255,.35); color: #fff; font-weight: 700; font-size: 13px; transition: transform .12s, background .12s; }
.chip:hover { transform: translateY(-1px); }
.chip .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--c); box-shadow: 0 0 0 2px #fff; }
.chip[aria-pressed="true"] { background: #fff; color: #4a2236; }
.chip[aria-pressed="false"] { opacity: .8; }
.chip[aria-pressed="false"] .dot { background: transparent; }
.filters .sep { width: 2px; height: 18px; border-radius: 2px; background: #fff; opacity: .5; margin: 0 4px; }

.status { font-size: 12.5px; color: var(--muted); padding: 12px 4px 0; min-height: 1.5em; }
.status.warn { color: var(--red); }

/* ---------- 본문 배치 ---------- */
main.layout { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) 300px; gap: 18px; padding-block: 10px 110px; align-items: start; }
@media (max-width: 1240px) { main.layout { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } aside.day { grid-column: 1 / -1; } }
@media (max-width: 780px) { main.layout { grid-template-columns: minmax(0, 1fr); } }

/* ---------- 달력 ---------- */
.cal { background: var(--surface); border-radius: 28px; padding: 16px 12px 12px; box-shadow: var(--card); min-width: 0; }
.cal-head { display: flex; align-items: baseline; gap: 8px; padding: 0 8px 10px; }
.cal-head h2 { font-family: var(--f-display); font-weight: 400; font-size: 30px; line-height: 1; margin: 0; color: var(--pink); }
.cal-head .yr { font-family: var(--f-display); font-size: 15px; color: var(--muted); }
.cal-head .cnt { margin-left: auto; font-size: 12px; font-weight: 700; color: var(--pink); background: var(--pink-soft); padding: 3px 10px; border-radius: 999px; }
.dow { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); }
.grid { display: flex; flex-direction: column; gap: 4px; }
.dow div { padding: 2px 2px 8px; font-family: var(--f-display); font-size: 14px; color: var(--muted); text-align: center; }
.dow div:first-child { color: var(--red); }
.dow div:last-child { color: var(--sat); }

/* 한 주 = 7칸 격자. 칸 배경은 모든 줄을 덮고, 여러 날 일정 막대는 칸을 가로질러 이어진다. */
.week { --rowh: 20px; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); column-gap: 4px; min-height: 100px; }
.cellbg { grid-row: 1 / -1; border: 1.5px solid transparent; border-radius: 16px; background: var(--surface-2); padding: 0; min-width: 0; transition: background .12s, border-color .12s; z-index: 0; }
.cellbg.blank { background: transparent; pointer-events: none; }
.cellbg:hover { background: var(--pink-soft); }
.cellbg.sel { background: var(--surface); border-color: var(--pink); box-shadow: 0 8px 18px -10px rgba(255, 92, 151, .7); }
.head, .bar, .ev, .more { z-index: 1; pointer-events: none; min-width: 0; }
.head { grid-row: 1; display: flex; flex-direction: column; align-items: flex-start; gap: 2px; padding: 4px 4px 2px; }
.num { font-family: var(--f-display); font-size: 16px; width: 28px; height: 28px; display: grid; place-items: center; border-radius: 50%; font-variant-numeric: tabular-nums; flex: none; }
.head.sun .num, .head.hkr .num, .head.hjp .num { color: var(--red); }
.head.sat .num { color: var(--sat); }
.head.today .num { background: var(--pink); color: var(--pink-ink); box-shadow: 0 3px 0 rgba(180, 30, 90, .25); }
.hol { font-size: 10.5px; font-weight: 700; line-height: 1.35; color: var(--red); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; padding: 0 3px; }
.hol.jp { color: var(--jp-ink); background: var(--red); border-radius: 999px; padding: 1px 7px; }
.hol.jp::before { content: "JP "; font-size: 9px; letter-spacing: .04em; opacity: .9; }
.bar { height: calc(var(--rowh) - 3px); align-self: center; margin: 0 3px; padding: 0 8px; border-radius: 7px; background: var(--c); color: var(--bar-ink); font-size: 11px; font-weight: 700; line-height: calc(var(--rowh) - 3px); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bar.cont-l { margin-left: -2px; border-top-left-radius: 0; border-bottom-left-radius: 0; }
.bar.cont-r { margin-right: -2px; border-top-right-radius: 0; border-bottom-right-radius: 0; }
.ev { height: calc(var(--rowh) - 3px); align-self: center; margin: 0 3px; font-size: 11px; font-weight: 500; line-height: calc(var(--rowh) - 3px); padding: 0 7px; border-radius: 7px; background: var(--cs); color: var(--fg); white-space: nowrap; overflow: hidden; display: flex; align-items: center; gap: 4px; }
.ev::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--c); flex: none; }
.ev span { overflow: hidden; text-overflow: ellipsis; }
.more { font-size: 10.5px; font-weight: 700; color: var(--pink); padding: 0 8px 4px; }
.dots { display: none; gap: 3px; flex-wrap: wrap; justify-content: center; }
.dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--c); }

@media (max-width: 1000px) and (min-width: 781px), (max-width: 520px) {
  .week { --rowh: 8px; min-height: 66px; column-gap: 3px; }
  .cellbg { border-radius: 12px; }
  .head { align-items: center; padding: 3px 1px 2px; }
  .num { font-size: 14px; width: 25px; height: 25px; }
  .bar { font-size: 0; padding: 0; height: 5px; margin: 0 2px; }
  .bar.cont-l { margin-left: -2px; } .bar.cont-r { margin-right: -2px; }
  .ev, .more { display: none; }
  .hol { font-size: 9px; text-align: center; padding: 0; }
  .hol.jp { padding: 0 4px; }
  .hol.jp::before { content: ""; }
  .dots { display: flex; }
  .cal { padding: 12px 6px 8px; border-radius: 22px; }
  .grid { gap: 3px; }
}
@media (max-width: 560px) {
  .monthnav { margin-left: 0; width: 100%; justify-content: space-between; }
  .brand { font-size: 28px; }
}

/* ---------- 가계부 ---------- */
.budget { padding-top: 14px; }
.cal-title { padding-top: 22px; margin-bottom: 2px; }
.bud-head { display: flex; align-items: center; gap: 10px 12px; flex-wrap: wrap; margin-bottom: 12px; }
.bud-head h2 { font-family: var(--f-display); font-weight: 400; font-size: 26px; margin: 0; }
.yearnav { display: flex; align-items: center; gap: 2px; background: var(--surface); border-radius: 999px; padding: 3px; box-shadow: var(--card); }
.yearnav button { width: 30px; height: 30px; border-radius: 50%; border: 0; background: transparent; color: var(--pink); font-size: 18px; font-weight: 700; }
.yearnav button:hover { background: var(--pink-soft); }
.yearnav span { font-family: var(--f-display); font-size: 17px; min-width: 3.4em; text-align: center; font-variant-numeric: tabular-nums; }
.bud-actions { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }
.pillbtn { height: 38px; padding: 0 16px; border-radius: 999px; border: 0; background: var(--fixed); color: #fff; font-family: var(--f-display); font-size: 15px; box-shadow: 0 3px 0 rgba(120, 20, 60, .2); transition: transform .12s; }
.pillbtn:hover { transform: translateY(-2px); }
.pillbtn.alt { background: var(--surface); color: var(--fixed); box-shadow: inset 0 0 0 2px var(--fixed); }
.tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-bottom: 12px; }
@media (max-width: 820px) { .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.tile { background: var(--surface); border-radius: 22px; padding: 14px 16px; box-shadow: var(--card); min-width: 0; }
.tile .k { font-size: 12px; font-weight: 700; color: var(--muted); }
.tile .v { font-family: var(--f-display); font-size: clamp(18px, 4.8vw, 24px); line-height: 1.2; margin-top: 4px; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tile .s { font-size: 11.5px; color: var(--muted); margin-top: 2px; }
.tile.hero { background: var(--fixed-soft); }
.tile.hero .v { color: var(--fixed); }
.meter { height: 6px; border-radius: 999px; background: var(--pink-soft); margin-top: 8px; overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--fixed); border-radius: 999px; }
.bud-grid { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 12px; align-items: start; }
@media (max-width: 1000px) { .bud-grid { grid-template-columns: minmax(0, 1fr); } }
.card { background: var(--surface); border-radius: 26px; padding: 18px; box-shadow: var(--card); min-width: 0; }
.card h3 { font-family: var(--f-display); font-weight: 400; font-size: 19px; margin: 0; }
.card-head { display: flex; align-items: center; gap: 8px 12px; flex-wrap: wrap; margin-bottom: 14px; }
.legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12px; color: var(--muted); margin-left: auto; }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.legend i { width: 12px; height: 12px; border-radius: 3px; background: var(--c); }
.legend i.plan, .seg.plan { background: repeating-linear-gradient(135deg, var(--fixed) 0 2px, transparent 2px 5px); box-shadow: inset 0 0 0 1.5px var(--fixed); }
.chart { position: relative; padding-left: 42px; }
.plot { position: relative; height: 190px; }
.gl { position: absolute; left: 0; right: 0; border-top: 1px dashed var(--line); }
.gl.base { border-top: 1.5px solid var(--line); }
.gl span { position: absolute; left: -42px; top: -8px; width: 36px; text-align: right; font-size: 10.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.cols { position: absolute; inset: 0; display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 4px; }
.col { position: relative; border: 0; background: transparent; padding: 0; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; border-radius: 10px 10px 0 0; min-width: 0; }
.col:hover, .col.sel { background: var(--pink-soft); }
.stack { width: min(28px, 70%); display: flex; flex-direction: column-reverse; gap: 2px; border-radius: 5px 5px 0 0; overflow: hidden; }
.seg { width: 100%; background: var(--c); flex: none; }
.seg.fix { --c: var(--fixed); } .seg.var { --c: var(--var); }
.col .val { font-size: 10.5px; font-weight: 700; color: var(--fg); margin-bottom: 3px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.months { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 4px; margin-top: 6px; }
.months span { text-align: center; font-size: 11.5px; color: var(--muted); }
.months span.now { color: var(--pink); font-weight: 700; }
.months span.sel { color: var(--fg); font-weight: 700; }
.tip { position: absolute; z-index: 3; transform: translate(-50%, calc(-100% - 8px)); background: var(--fg); color: var(--bg); border-radius: 12px; padding: 8px 11px; font-size: 12px; pointer-events: none; white-space: nowrap; box-shadow: var(--shadow); }
.tip b { display: block; font-family: var(--f-display); font-size: 14px; font-weight: 400; margin-bottom: 2px; }
.tip .r { display: flex; gap: 14px; justify-content: space-between; font-variant-numeric: tabular-nums; }
.tip .r i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; background: var(--c); margin-right: 5px; }
.mdetail { margin-top: 16px; border-top: 2px dashed var(--line); padding-top: 14px; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 14px 18px; }
@media (max-width: 640px) { .mdetail { grid-template-columns: minmax(0, 1fr); } }
.md-sum { display: flex; gap: 6px 14px; flex-wrap: wrap; align-items: baseline; grid-column: 1 / -1; }
.md-sum h4 { font-family: var(--f-display); font-weight: 400; font-size: 20px; margin: 0; }
.md-sum span { font-size: 12.5px; color: var(--muted); }
.md-sum b { color: var(--fg); font-variant-numeric: tabular-nums; }
.sublbl { font-size: 12px; font-weight: 700; color: var(--muted); margin-bottom: 8px; }
.catbars { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 7px; }
.catbars button { display: grid; grid-template-columns: 78px minmax(0, 1fr) auto; gap: 8px; align-items: center; font: inherit; font-size: 12.5px; color: var(--fg); text-align: left; background: none; border: 0; border-radius: 10px; padding: 4px 6px; margin: -4px -6px; width: calc(100% + 12px); cursor: pointer; }
.catbars button:hover { background: var(--surface-2); }
.catbars button.on { background: var(--pink-soft); font-weight: 700; }
.catbars button.on .bar2 { background: var(--pink); }

  // ---------- 날짜 도우미 (UTC 일 번호로 계산해 서머타임 영향 없음) ----------
  const DAY = 864e5;
  const pad = n => String(n).padStart(2, "0");
  const idx = s => { const [y, m, d] = s.split("-").map(Number); return Math.round(Date.UTC(y, m - 1, d) / DAY); };
  const str = i => { const d = new Date(i * DAY); return `${d.getUTCFullYear()}-${pad(d.getUTCMonth() + 1)}-${pad(d.getUTCDate())}`; };
  const dow = i => new Date(i * DAY).getUTCDay();
  const now = new Date();
  const TODAY = `${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())}`;
  const WD = ["일", "월", "화", "수", "목", "금", "토"];
  const validYMD = (y, m, d) => { const t = new Date(Date.UTC(y, m - 1, d)); return t.getUTCMonth() === m - 1 && t.getUTCDate() === d; };
  const addMonth = (y, m, n) => { const t = m - 1 + n; return [y + Math.floor(t / 12), ((t % 12) + 12) % 12 + 1]; };

  // 반복 일정을 [a, b] 범위의 발생일(시작 일 번호) 목록으로 펼친다
  function expand(ev, a, b) {
    const s = idx(ev.start);
    const dur = Math.max(0, idx(ev.end || ev.start) - s);
    const until = ev.until ? idx(ev.until) : Infinity;
    const ex = new Set(ev.exdates || []);
    const out = [];
    const push = o => { if (o + dur >= a && o <= b && o <= until && !ex.has(str(o))) out.push(o); };
    const rep = ev.repeat || "none";
    if (rep === "none") { push(s); return out; }
    if (rep === "weekly") {
      const k = Math.max(0, Math.ceil((a - dur - s) / 7));
      for (let o = s + 7 * k; o <= b && o <= until; o += 7) push(o);
      return out;
    }
    const [sy, sm, sd] = ev.start.split("-").map(Number);
    const by = new Date(b * DAY).getUTCFullYear();
    if (rep === "monthly") {
      const ay = new Date((a - dur) * DAY);
      let n = Math.max(0, (ay.getUTCFullYear() - sy) * 12 + ay.getUTCMonth() + 1 - sm - 1);
      for (;; n++) {
        const [y, m] = addMonth(sy, sm, n);
        if (y > by + 1) break;
        if (!validYMD(y, m, sd)) continue;
        const o = idx(`${y}-${pad(m)}-${pad(sd)}`);
        if (o > b || o > until) break;
        push(o);
      }
      return out;
    }
    if (rep === "yearly") {
      const ay = new Date((a - dur) * DAY).getUTCFullYear();
      for (let y = Math.max(sy, ay); y <= by; y++) {
        if (!validYMD(y, sm, sd)) continue;
        const o = idx(`${y}-${pad(sm)}-${pad(sd)}`);
        if (o > until) break;
        push(o);
      }
    }
    return out;
  }

  // ---------- 상태 ----------
  const store = (() => { try { return window.localStorage; } catch { return null; } })();
  const load = (k, d) => { try { const v = store && store.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } };
  const save = (k, v) => { try { store && store.setItem(k, JSON.stringify(v)); } catch {} };

  const state = {
    year: now.getFullYear(),
    month: now.getMonth() + 1,   // 왼쪽(첫 번째) 달
    sel: TODAY,
    show: load("rom.show", { dad: true, mom: true, romi: true }),
    hol: load("rom.hol", { kr: true, jp: true }),
    events: [],
    fixed: [],          // 고정비
    expenses: [],       // 변동 지출
    assets: [],         // 자산
    byear: now.getFullYear(),   // 가계부 연도
    bmonth: now.getMonth() + 1, // 가계부에서 고른 달
    bcat: null,                 // 가계부 분류별에서 고른 분류
    loaded: false,
    canWrite: false,   // 가족 비밀번호로 들어오면 true
  };

  const $ = id => document.getElementById(id);
  const el = (tag, attrs = {}, ...kids) => {
    const n = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) {
      if (k === "class") n.className = v;
      else if (k === "style") n.setAttribute("style", v);
      else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
      else if (v !== false && v != null) n.setAttribute(k, v === true ? "" : v);
    }
    for (const k of kids.flat()) if (k != null && k !== false) n.append(k.nodeType ? k : document.createTextNode(k));
    return n;
  };

  const colorOf = who => { const w = (who || []).filter(x => P[x]); return w.length === 1 ? P[w[0]] : FAMILY; };
  const whoLabel = who => { const w = (who || []).filter(x => P[x]); return w.length === PEOPLE.length ? "가족 모두" : w.map(x => P[x].name).join("·"); };
  const visible = ev => (ev.who || []).some(w => state.show[w]);

  function occurrencesIn(a, b) {
    const map = new Map();
    for (const ev of state.events) {
      if (!visible(ev)) continue;
      const dur = Math.max(0, idx(ev.end || ev.start) - idx(ev.start));
      for (const o of expand(ev, a, b)) {
        for (let d = Math.max(o, a); d <= Math.min(o + dur, b); d++) {
          const k = str(d);
          if (!map.has(k)) map.set(k, []);
          map.get(k).push({ ev, occ: str(o), multi: dur > 0, dayN: d - o + 1, dayT: dur + 1 });
        }
      }
    }
    for (const list of map.values()) list.sort((x, y) => (x.ev.time || "").localeCompare(y.ev.time || "") || x.ev.title.localeCompare(y.ev.title));
    return map;
  }
  function holidaysOf(k) {
    const h = [];
    if (state.hol.kr && KR[k]) h.push({ n: KR[k], c: "kr" });
    if (state.hol.jp && JP[k]) h.push({ n: JP[k], c: "jp" });
    return h;
  }
  const inShown = k => {
    const [y, m] = k.split("-").map(Number);
    const [y2, m2] = addMonth(state.year, state.month, 1);
    return (y === state.year && m === state.month) || (y === y2 && m === m2);
  };

  // ---------- 렌더 ----------
  function renderFilters() {
    const toggle = (obj, key, saveKey) => () => { obj[key] = !obj[key]; save(saveKey, obj); renderAll(); };
    $("filters").replaceChildren(
      ...PEOPLE.map(p => el("button", { class: "chip", "aria-pressed": String(!!state.show[p.id]), style: `--c:${p.c}`, onclick: toggle(state.show, p.id, "rom.show") }, el("span", { class: "dot" }), p.name)),
      el("span", { class: "sep", "aria-hidden": "true" }),
      el("button", { class: "chip", "aria-pressed": String(!!state.hol.kr), style: "--c:var(--red)", onclick: toggle(state.hol, "kr", "rom.hol") }, el("span", { class: "dot" }), "한국 공휴일"),
      el("button", { class: "chip", "aria-pressed": String(!!state.hol.jp), style: "--c:var(--red)", onclick: toggle(state.hol, "jp", "rom.hol") }, el("span", { class: "dot" }), "일본 공휴일"),
    );
  }

  // [a, b]에 걸치는 일정 발생(시작~끝 일 번호) 목록
  function spansIn(a, b) {
    const out = [];
    for (const ev of state.events) {
      if (!visible(ev)) continue;
      const dur = Math.max(0, idx(ev.end || ev.start) - idx(ev.start));
      for (const o of expand(ev, a, b)) out.push({ ev, s: o, e: o + dur });
    }
    return out;
  }

  function renderMonth(box, year, month) {
    const first = idx(`${year}-${pad(month)}-01`);
    const [ny, nm] = addMonth(year, month, 1);
    const last = idx(`${ny}-${pad(nm)}-01`) - 1;
    const spans = spansIn(first, last);
    const multi = spans.filter(x => x.e > x.s);
    const singleByDay = new Map();
    for (const x of spans) if (x.e === x.s) { if (!singleByDay.has(x.s)) singleByDay.set(x.s, []); singleByDay.get(x.s).push(x); }
    for (const l of singleByDay.values()) l.sort((p, q) => (p.ev.time || "").localeCompare(q.ev.time || "") || p.ev.title.localeCompare(q.ev.title));
    const ROWS = 3; // 칸마다 보여줄 일정 줄 수
    const weeks = [];

    for (let ws = first - dow(first); ws <= last; ws += 7) {
      const we = ws + 6;
      const kids = [];
      const hidden = new Array(7).fill(0);
      const used = Array.from({ length: 7 }, () => new Set()); // 칸별로 막대가 차지한 줄

      // 1) 여러 날 일정: 이번 주·이번 달 안으로 잘라 줄(lane)을 배정
      const segs = multi.map(x => ({ ...x, cs: Math.max(x.s, ws, first), ce: Math.min(x.e, we, last) }))
        .filter(x => x.cs <= x.ce)
        .sort((p, q) => p.cs - q.cs || (q.ce - q.cs) - (p.ce - p.cs) || p.ev.title.localeCompare(q.ev.title));
      const laneEnd = [];
      for (const g of segs) {
        let lane = laneEnd.findIndex(end => end < g.cs);
        if (lane < 0) { lane = laneEnd.length; laneEnd.push(g.ce); } else laneEnd[lane] = g.ce;
        if (lane >= ROWS) { for (let d = g.cs; d <= g.ce; d++) hidden[d - ws]++; continue; }
        for (let d = g.cs; d <= g.ce; d++) used[d - ws].add(lane);
        const c = colorOf(g.ev.who);
        const contL = g.cs > g.s, contR = g.ce < g.e;
        kids.push(el("div", {
          class: "bar" + (contL ? " cont-l" : "") + (contR ? " cont-r" : ""),
          style: `--c:${c.c};grid-row:${lane + 2};grid-column:${g.cs - ws + 1} / span ${g.ce - g.cs + 1}`,
          title: g.ev.title, "aria-hidden": "true",
        }, (contL ? "… " : "") + g.ev.title));
      }

      // 2) 칸 배경·날짜·하루 일정
      for (let i = 0; i < 7; i++) {
        const d = ws + i;
        if (d < first || d > last) { kids.push(el("div", { class: "cellbg blank", style: `grid-column:${i + 1}`, "aria-hidden": "true" })); continue; }
        const k = str(d), date = new Date(d * DAY), wd = i;
        const hols = holidaysOf(k);
        const singles = singleByDay.get(d) || [];
        const nAll = singles.length + segs.filter(g => g.cs <= d && g.ce >= d).length;
        const label = `${month}월 ${date.getUTCDate()}일 ${WD[wd]}요일` + (hols.length ? `, ${hols.map(h => h.n).join(", ")}` : "") + (nAll ? `, 일정 ${nAll}개` : "");
        kids.push(el("button", {
          class: "cellbg" + (k === state.sel ? " sel" : ""), style: `grid-column:${i + 1}`, "aria-label": label,
          onclick: () => { state.sel = k; renderAll(); },
        }));
        const hcls = ["head", wd === 0 && "sun", wd === 6 && "sat", k === TODAY && "today",
          hols.some(h => h.c === "kr") && "hkr", hols.some(h => h.c === "jp") && "hjp"].filter(Boolean).join(" ");
        kids.push(el("div", { class: hcls, style: `grid-column:${i + 1}`, "aria-hidden": "true" },
          el("span", { class: "num" }, String(date.getUTCDate())),
          hols.map(h => el("span", { class: `hol ${h.c}`, title: h.n }, h.n)),
          singles.length ? el("span", { class: "dots" }, singles.slice(0, 4).map(({ ev }) => el("i", { style: `--c:${colorOf(ev.who).c}` }))) : null));
        let r = 0;
        for (const { ev } of singles) {
          while (r < ROWS && used[i].has(r)) r++;
          if (r >= ROWS) { hidden[i]++; continue; }
          const c = colorOf(ev.who);
          kids.push(el("div", { class: "ev", style: `--c:${c.c};--cs:${c.cs};grid-row:${r + 2};grid-column:${i + 1}`, title: ev.title, "aria-hidden": "true" },
            el("span", {}, (ev.time ? ev.time + " " : "") + ev.title)));
          r++;
        }
        const sp = state.canWrite ? spendOn(k).total : 0;
        if (hidden[i] || sp) kids.push(el("div", { class: "foot", style: `grid-row:${ROWS + 2};grid-column:${i + 1}`, "aria-hidden": "true" },
          hidden[i] ? el("span", { class: "more" }, `+${hidden[i]}`) : null,
          sp ? el("span", { class: "spend", title: won(sp) }, "-" + man(sp)) : null));
      }
      weeks.push(el("div", { class: "week", style: `grid-template-rows:auto repeat(${ROWS}, var(--rowh)) auto 1fr` }, kids));
    }

    box.setAttribute("aria-label", `${year}년 ${month}월 달력`);
    box.replaceChildren(
      el("div", { class: "cal-head" },
        el("h2", {}, `${month}월`),
        el("span", { class: "yr" }, String(year)),
        spans.length ? el("span", { class: "cnt" }, `일정 ${spans.length}`) : null),
      el("div", { class: "dow", "aria-hidden": "true" }, WD.map(w => el("div", {}, w))),
      el("div", { class: "grid" }, weeks),
    );
  }

  function renderDay() {
    const k = state.sel, i = idx(k), d = new Date(i * DAY);
    const list = occurrencesIn(i, i).get(k) || [];
    const hols = holidaysOf(k);
    const diff = i - idx(TODAY);
    const rel = diff === 0 ? "오늘" : diff === 1 ? "내일" : diff === -1 ? "어제" : diff > 0 ? `D-${diff}` : `${-diff}일 전`;
    let body;
    if (!state.loaded && !list.length) body = el("div", { class: "empty" }, "가족 일정을 불러오는 중이에요…");
    else if (list.length) body = el("ul", { class: "agenda" }, list.map(({ ev, occ, multi, dayN, dayT }) => {
      const c = colorOf(ev.who);
      return el("li", {}, el("button", { class: "item", style: `--c:${c.c};--cs:${c.cs}`, onclick: () => openEditor(ev, occ) },
        el("span", { class: "t" }, multi ? `${dayN}/${dayT}일` : (ev.time || "종일")),
        el("span", {},
          el("div", { class: "ti" }, ev.title),
          el("div", { class: "meta" },
            el("span", { class: "tag" }, whoLabel(ev.who)),
            ev.repeat && ev.repeat !== "none" ? el("span", { class: "tag plain" }, REPEAT_LABEL[ev.repeat]) : null),
          ev.memo ? el("div", { class: "memo" }, ev.memo) : null)));
    }));
    else body = el("div", { class: "empty" },
      el("span", { class: "big" }, state.events.length ? "일정 없는 날" : "첫 일정을 넣어 볼까요?"),
      state.events.length ? "로미랑 푹 쉬는 날이에요." : "로미의 예방접종, 영유아검진, 어린이집 일정을 버튼 한 번으로 넣을 수 있어요.");
    $("day").replaceChildren(...[
      el("div", { class: "date" }, el("h3", {}, `${d.getUTCMonth() + 1}월 ${d.getUTCDate()}일 ${WD[dow(i)]}요일`), el("span", { class: "rel" }, rel)),
      el("div", { class: "yr" }, `${d.getUTCFullYear()}년`),
      hols.length ? el("div", { class: "hols" }, hols.map(h => el("span", { class: h.c }, (h.c === "jp" ? "JP " : "") + h.n))) : null,
      body,
      state.canWrite ? el("button", { class: "addday", onclick: () => openEditor(null, k) }, `+ ${d.getUTCMonth() + 1}월 ${d.getUTCDate()}일에 일정 추가`) : null,
      state.canWrite ? daySpendSection(k) : null,
      el("div", { class: "legend-note" }, "공휴일은 2025–2027년만 표시돼요"),
      state.canWrite ? el("button", { class: "logout", onclick: logout }, "이 기기에서 로그아웃") : null,
    ].filter(Boolean));
  }

  // =====================================================================
  // 가계부: 고정비(매월·매년 나가는 돈) + 변동 지출(그날 쓴 돈)
  // =====================================================================
  const CATS = ["주거·관리비", "통신", "보험", "육아·로미", "교육", "구독", "교통·차량", "식비", "생활용품", "의료", "경조사", "대출·이자", "용돈", "기타"];
  // 분류별 파스텔 색상(색상환 각도). 밝기·채도는 CSS --cat-* 토큰이 테마에 맞춰 정한다.
  const CAT_HUE = { "대출·이자": 0, "주거·관리비": 26, "교육": 50, "식비": 78, "용돈": 104, "생활용품": 130, "의료": 156,
    "통신": 182, "교통·차량": 206, "구독": 230, "보험": 256, "경조사": 282, "육아·로미": 330 };
  const catStyle = c => c in CAT_HUE ? `--h:${CAT_HUE[c]};--sx:1` : "--h:0;--sx:0";
  const FIXED_PRESETS = [["관리비", "주거·관리비"], ["통신비", "통신"], ["보험료", "보험"], ["어린이집", "육아·로미"], ["OTT 구독", "구독"], ["대출이자", "대출·이자"], ["아빠 용돈", "용돈"], ["엄마 용돈", "용돈"]];
  const EXP_QUICK = ["식비", "생활용품", "육아·로미", "의료", "교통·차량", "경조사"];
  const NOW_Y = now.getFullYear(), NOW_M = now.getMonth() + 1;
  const ymOf = (y, m) => `${y}-${pad(m)}`;
  const daysIn = (y, m) => new Date(Date.UTC(y, m, 0)).getUTCDate();
  const won = n => "₩" + Math.round(n).toLocaleString("ko-KR");
  const man = n => {
    if (n >= 1e8) return (Math.round(n / 1e7) / 10).toLocaleString("ko-KR") + "억";
    if (n >= 1e4) return (n >= 1e6 ? Math.round(n / 1e4) : Math.round(n / 1e3) / 10).toLocaleString("ko-KR") + "만";
    return Math.round(n).toLocaleString("ko-KR");
  };
  const isFuture = (y, m) => y > NOW_Y || (y === NOW_Y && m > NOW_M);
  const activeIn = (f, ym) => f.from <= ym && (!f.to || ym <= f.to);
  const normFixed = v => ({
    id: String(v.id), name: String(v.name || ""), amount: Number(v.amount) || 0, category: String(v.category || "기타"),
    cycle: v.cycle === "yearly" ? "yearly" : "monthly", day: Number(v.day) || 1, payMonth: Number(v.payMonth) || 1,
    from: String(v.from || "0000-00"), to: String(v.to || ""), who: Array.isArray(v.who) ? v.who : [], memo: String(v.memo || ""), createdAt: v.createdAt,
  });
  const normExp = v => ({
    id: String(v.id), date: String(v.date || ""), amount: Number(v.amount) || 0, category: String(v.category || "기타"),
    who: Array.isArray(v.who) ? v.who : [], memo: String(v.memo || ""), createdAt: v.createdAt,
  });

  // 상단 아빠·엄마·로미 필터: 모두 켜져 있으면 전부, 일부만 켜면 그 사람 몫만 (가족 공동은 빠짐)
  const allShown = () => PEOPLE.every(p => state.show[p.id]);
  const shownBy = who => allShown() || (who || []).some(w => state.show[w]);
  const myFixed = () => state.fixed.filter(f => shownBy(f.who));
  const myExp = () => state.expenses.filter(e => shownBy(e.who));
  const myAssets = () => state.assets.filter(a => shownBy(a.owner === "family" ? [] : [a.owner]));
  function filterNote() {
    if (allShown()) return null;
    const on = PEOPLE.filter(p => state.show[p.id]);
    return el("div", { class: "fnote" },
      el("span", {}, on.length ? `${on.map(p => p.name).join("·")} 몫만 보는 중` : "아무도 고르지 않았어요", el("small", {}, " · 가족 공동 항목은 빠져요")),
      el("button", { type: "button", onclick: () => { PEOPLE.forEach(p => (state.show[p.id] = true)); save("rom.show", state.show); renderAll(); } }, "모두 보기"));
  }

  // 그 달에 나가는 고정비 (결제일은 그 달의 마지막 날을 넘지 않게)
  function fixedIn(y, m) {
    const ym = ymOf(y, m);
    return myFixed().filter(f => activeIn(f, ym) && (f.cycle !== "yearly" || f.payMonth === m))
      .map(f => ({ f, date: `${ym}-${pad(Math.min(f.day, daysIn(y, m)))}` }));
  }
  function monthStats(y, m) {
    const ym = ymOf(y, m);
    const fx = fixedIn(y, m);
    const exp = myExp().filter(e => e.date.startsWith(ym));
    const fixed = fx.reduce((s, x) => s + x.f.amount, 0);
    const variable = exp.reduce((s, e) => s + e.amount, 0);
    return { y, m, fx, exp, fixed, variable, total: fixed + variable, future: isFuture(y, m) };
  }
  function spendOn(k) {
    const [y, m] = k.split("-").map(Number);
    const fx = fixedIn(y, m).filter(x => x.date === k);
    const ex = myExp().filter(e => e.date === k);
    return { fx, ex, total: fx.reduce((s, x) => s + x.f.amount, 0) + ex.reduce((s, e) => s + e.amount, 0) };
  }
  function niceMax(v) {
    if (v <= 0) return 1000000;
    const p = 10 ** Math.floor(Math.log10(v));
    for (const k of [1, 1.5, 2, 2.5, 3, 4, 5, 6, 8, 10]) if (k * p >= v) return k * p;
    return 10 * p;
  }

  function renderBudget() {

    const head = el("div", { class: "bud-head" },

        el("button", { class: "helpbtn", "aria-label": "엑셀·텍스트로 올리는 방법", onclick: openImportHelp }, "?"),
        el("button", { class: "pillbtn alt", onclick: openImport }, "엑셀·텍스트 올리기"),
        el("button", { class: "pillbtn alt", onclick: () => openFixedEditor(null) }, "+ 고정비"),
        el("button", { class: "pillbtn", onclick: () => openExpenseEditor(null, state.sel) }, "+ 지출 기록")) : null);

    if (state.canWrite) head.append(...[filterNote()].filter(Boolean));
    if (!state.canWrite) {
      box.replaceChildren(head, el("div", { class: "card locked" },
        "가족 비밀번호를 넣으면 가계부가 보여요.", el("br"),
        el("button", { class: "btn primary", onclick: () => showLogin() }, "비밀번호 넣기")));
      return;
    }

    const months = Array.from({ length: 12 }, (_, i) => monthStats(y, i + 1));
    const past = months.filter(s => !s.future);
    const ytd = past.reduce((a, s) => a + s.total, 0);
    const ytdFixed = past.reduce((a, s) => a + s.fixed, 0);
    const avg = past.length ? ytd / past.length : 0;
    const nowYm = ymOf(NOW_Y, NOW_M);
    const monthlyNow = myFixed().filter(f => f.cycle === "monthly" && activeIn(f, nowYm));
    const yearlyNow = myFixed().filter(f => f.cycle === "yearly" && activeIn(f, nowYm));
    const monthlyFixed = monthlyNow.reduce((a, f) => a + f.amount, 0);
    const yearlyFixed = yearlyNow.reduce((a, f) => a + f.amount, 0);
    const share = ytd ? Math.round(ytdFixed / ytd * 100) : 0;
    const periodLbl = !past.length ? "아직 지난 달이 없어요" : y === NOW_Y ? `1월–${NOW_M}월 (이번 달 포함)` : "1월–12월";

    const tiles = el("div", { class: "tiles" },
      el("div", { class: "tile hero" },
        el("div", { class: "k" }, "매달 나가는 고정비"),
        el("div", { class: "v" }, won(monthlyFixed)),
        el("div", { class: "s" }, yearlyFixed ? `+ 연 1회 ${won(yearlyFixed)} (월 ${man(yearlyFixed / 12)}원꼴)` : `${monthlyNow.length}개 항목`)),
      el("div", { class: "tile" },
        el("div", { class: "k" }, `${y}년 지출`),
        el("div", { class: "v" }, won(ytd)),
        el("div", { class: "s" }, periodLbl)),
      el("div", { class: "tile" },
        el("div", { class: "k" }, "한 달 평균"),
        el("div", { class: "v" }, won(avg)),
        el("div", { class: "s" }, past.length ? `${past.length}개월 평균` : "–")),
      el("div", { class: "tile" },
        el("div", { class: "k" }, "지출 중 고정비 비중"),
        el("div", { class: "v" }, ytd ? `${share}%` : "–"),
        el("div", { class: "meter", role: "img", "aria-label": `고정비 비중 ${share}%` }, el("i", { style: `width:${share}%` }))));

    // ----- 연간 지출 흐름 (월별 누적 막대: 고정비 + 변동 지출) -----
    const H = 190;
    const max = niceMax(Math.max(...months.map(s => s.total)));

    const showTip = (col, s) => {
      tip.replaceChildren(
        el("b", {}, `${s.y}년 ${s.m}월${s.future ? " (예정)" : ""}`),
        el("div", { class: "r", style: "--c:var(--fixed)" }, el("span", {}, el("i"), "고정비"), el("span", {}, won(s.fixed))),
        el("div", { class: "r", style: "--c:var(--var)" }, el("span", {}, el("i"), "변동 지출"), el("span", {}, won(s.variable))),

    const cols = months.map(s => {

      const label = s.m === state.bmonth || (s === topMonth && s.total > 0);
      const col = el("button", {
        class: "col" + (s.m === state.bmonth ? " sel" : ""),
        "aria-label": `${s.m}월${s.future ? " 예정" : ""}: 고정비 ${won(s.fixed)}, 변동 지출 ${won(s.variable)}, 합계 ${won(s.total)}`,
        onclick: () => { state.bmonth = s.m; renderBudget(); },
      },
        label && s.total ? el("span", { class: "val" }, man(s.total)) : null,
        s.total ? el("div", { class: "stack" },

          vh ? el("div", { class: "seg var", style: `height:${vh}px` }) : null) : null);
      col.addEventListener("mouseenter", () => showTip(col, s));

          el("span", {}, el("i", { style: "--c:var(--fixed)" }), "고정비"),
          el("span", {}, el("i", { style: "--c:var(--var)" }), "변동 지출"),
          y >= NOW_Y ? el("span", {}, el("i", { class: "plan" }), "앞으로 나갈 고정비") : null)),
      el("div", { class: "chart" }, plot,
        el("div", { class: "months", "aria-hidden": "true" }, months.map(s => el("span", {

        }, `${s.m}월`))), tip),

      monthDetail(months[state.bmonth - 1]));

    box.replaceChildren(head, tiles, el("div", { class: "bud-grid" }, chartCard, fixedCard(monthlyFixed, yearlyFixed)));
  }

  // 고른 달: 분류별 합계 + 지출 내역
  function monthDetail(s) {
    const byCat = new Map();
    for (const { f } of s.fx) byCat.set(f.category, (byCat.get(f.category) || 0) + f.amount);
    for (const e of s.exp) byCat.set(e.category, (byCat.get(e.category) || 0) + e.amount);
    const cats = [...byCat].sort((a, b) => b[1] - a[1]).slice(0, 8);
    const top = cats.length ? cats[0][1] : 1;
    const pick = byCat.has(state.bcat) ? state.bcat : null;
    const rows = [
      ...s.fx.map(({ f, date }) => ({ date, amount: f.amount, fixed: true, item: f, label: f.name, tag: "고정", cat: f.category })),
      ...s.exp.map(e => ({ date: e.date, amount: e.amount, fixed: false, item: e, label: e.memo || e.category, tag: e.category, cat: e.category })),
    ].filter(r => !pick || r.cat === pick)
     .sort((a, b) => b.date.localeCompare(a.date) || b.amount - a.amount);
    const pickCat = c => { state.bcat = state.bcat === c ? null : c; renderBudget(); };
    return el("div", { class: "mdetail" },
      el("div", { class: "md-sum" },
        el("h4", {}, `${s.m}월${s.future ? " 예정" : ""}`),

        el("span", {}, "고정비 ", el("b", {}, won(s.fixed))),

      el("div", {},

        cats.length ? el("ul", { class: "catbars" + (pick ? " picking" : "") }, cats.map(([c, v]) => el("li", {},
          el("button", { class: c === pick ? "on" : "", style: catStyle(c), "aria-pressed": String(c === pick), onclick: () => pickCat(c) },
            el("span", {}, c),
            el("span", { class: "track" }, el("span", { class: "bar2", style: `display:block;width:${v / top * 100}%` })),
            el("span", { class: "amt" }, man(v)))))) : el("div", { class: "fx-sub" }, "이 달에는 아직 나간 돈이 없어요.")),
      el("div", {},

        rows.length ? el("ul", { class: "ds-list" }, rows.map(r => el("li", {},
          el("button", { class: "ds-row", style: catStyle(r.cat), title: r.cat, onclick: () => r.fixed ? openFixedEditor(r.item) : openExpenseEditor(r.item) },
            el("span", { class: "ds-tag" + (r.fixed ? " fixed" : "") }, r.tag),
            el("span", { class: "ds-name" }, el("small", {}, `${Number(r.date.slice(5, 7))}/${Number(r.date.slice(8))}`), r.label),
            el("span", { class: "ds-amt" }, won(r.amount)))))) : null));
  }

  // 고정비 한눈에 보기
  function fixedCard(monthlyFixed, yearlyFixed) {
    const nowYm = ymOf(NOW_Y, NOW_M);
    const list = myFixed().sort((a, b) =>
      (activeIn(b, nowYm) - activeIn(a, nowYm)) || (a.cycle === b.cycle ? 0 : a.cycle === "monthly" ? -1 : 1) ||
      (a.cycle === "yearly" ? a.payMonth - b.payMonth : 0) || a.day - b.day || b.amount - a.amount);
    return el("div", { class: "card" },
      el("div", { class: "card-head" }, el("h3", {}, "고정비 한눈에"),
        el("button", { class: "pillbtn alt", style: "margin-left:auto;height:32px;font-size:14px", onclick: () => openFixedEditor(null) }, "+ 추가")),
      list.length ? el("ul", { class: "fixlist" }, list.map(f => {
        const on = activeIn(f, nowYm);
        const sub = [whoText(f.who) || "가족 공동", f.category, f.to ? `${f.to.replace("-", ".")}까지` : null, !on && f.from > nowYm ? `${f.from.replace("-", ".")}부터` : null, !on && f.to && f.to < nowYm ? "끝남" : null].filter(Boolean).join(" · ");
        return el("li", {}, el("button", { class: "fx-row" + (on ? "" : " off"), onclick: () => openFixedEditor(f) },
          el("span", { class: "fx-day" }, f.cycle === "yearly" ? el("span", {}, `${f.payMonth}월`, el("br"), `${f.day}일`) : `${f.day}일`),

          el("span", { class: "fx-amt" }, won(f.amount))));
      })) : el("div", { class: "empty" }, el("span", { class: "big" }, "고정비가 아직 없어요"), "관리비, 통신비, 보험료, 어린이집비처럼 매달 나가는 돈을 넣으면 여기 한눈에 모여요."),

        ex.map(e => el("li", {}, el("button", { class: "ds-row", style: catStyle(e.category), title: e.category, onclick: () => openExpenseEditor(e) },
          el("span", { class: "ds-tag" }, e.category), el("span", { class: "ds-name" }, e.memo || e.category), el("span", { class: "ds-amt" }, won(e.amount)))))) : null,

  // ----- 입력 창 공통 -----
  // stack: 이미 열린 창 위에 하나 더 띄운다 (도움말 등). 닫으면 아래 창이 그대로 남는다.
  function openSheet(titleText, stack = false) {
    const root = $("modalRoot");
    const onKey = e => { if (e.key === "Escape" && root.lastElementChild === scrim) close(); };
    const close = () => { if (stack) scrim.remove(); else root.replaceChildren(); document.removeEventListener("keydown", onKey); };
    document.addEventListener("keydown", onKey);
    const body = el("div");
    const scrim = el("div", { class: "scrim", onclick: e => { if (e.target === scrim) close(); } },
      el("div", { class: "sheet", role: "dialog", "aria-modal": "true", "aria-label": titleText },
        el("div", { class: "sheet-head" }, el("h3", {}, titleText)), body));
    if (stack) root.append(scrim); else root.replaceChildren(scrim);
    return { body, close };
  }
  const field = (id, label, input) => el("div", { class: "field" }, el("label", { for: id }, label), input);
  // 아빠·엄마·로미 고르기 (여러 명 가능, 아무도 안 고르면 가족 공동)
  function whoPicker(selected) {
    const who = new Set(selected || []);

  // 날짜 → {y, m, d, hasYear}  (엑셀 날짜, 2026-11-03, 2026.11.3, 26/11/03, 11/3, 11월 3일, 20261103)
  function parseDate(v) {
    if (v instanceof Date && !isNaN(v)) return { y: v.getFullYear(), m: v.getMonth() + 1, d: v.getDate(), hasYear: true };
    if (typeof v === "number" && v > 20000 && v < 80000) { const t = new Date(Math.round((v - 25569) * DAY)); return { y: t.getUTCFullYear(), m: t.getUTCMonth() + 1, d: t.getUTCDate(), hasYear: true }; }
    const s = String(v ?? "").trim().replace(/^(매년|매월|매달)\s*/, "");
    let r;
    const ok = (y, m, d, hasYear) => (m >= 1 && m <= 12 && d >= 1 && d <= 31 && validYMD(y, m, d) ? { y, m, d, hasYear } : null);
    if ((r = s.match(/^(\d{4})\s*[-./년]\s*(\d{1,2})\s*[-./월]\s*(\d{1,2})/))) return ok(+r[1], +r[2], +r[3], true);
    if ((r = s.match(/^(\d{4})(\d{2})(\d{2})(?:\D|$)/))) return ok(+r[1], +r[2], +r[3], true);
    if ((r = s.match(/^(\d{2})[-./](\d{1,2})[-./](\d{1,2})(?:\D|$)/))) return ok(2000 + +r[1], +r[2], +r[3], true);
    if ((r = s.match(/^(\d{1,2})\s*[-./월]\s*(\d{1,2})\s*일?(?:\s|$|\()/))) return ok(state.byear, +r[1], +r[2], false);
    return null;
  }
  // "25", "25일", "매월 25일", "말일" → 25 / 31
  function parseDay(v) {
    const s = String(v ?? "").trim().replace(/^(매월|매달)\s*/, "");
    if (/^말일$/.test(s)) return 31;
    const r = s.match(/^(\d{1,2})\s*일?$/);
    return r && +r[1] >= 1 && +r[1] <= 31 ? +r[1] : 0;
  }
  // "52,000", "₩52,000원", "5.2만", "1억 2천만" → 숫자 (음수 = 취소·환불)
  function parseAmount(v) {
    if (typeof v === "number") return Number.isFinite(v) ? Math.round(v) : NaN;
    let s = String(v ?? "").replace(/[₩\s,]|원$/g, "").replace(/원/g, "");
    if (!s) return NaN;
    let neg = false;
    if (/^\(.*\)$/.test(s)) { neg = true; s = s.slice(1, -1); }
    if (s.startsWith("-")) { neg = true; s = s.slice(1); }
    let total = 0, rest = s, m;
    if ((m = rest.match(/^(\d+(?:\.\d+)?)억/))) { total += Number(m[1]) * 1e8; rest = rest.slice(m[0].length); }
    if ((m = rest.match(/^(\d+(?:\.\d+)?)천만/))) { total += Number(m[1]) * 1e7; rest = rest.slice(m[0].length); }
    if ((m = rest.match(/^(\d+(?:\.\d+)?)만/))) { total += Number(m[1]) * 1e4; rest = rest.slice(m[0].length); }
    if ((m = rest.match(/^(\d+(?:\.\d+)?)천/))) { total += Number(m[1]) * 1e3; rest = rest.slice(m[0].length); }
    if (rest && /^\d+(\.\d+)?$/.test(rest)) { total += Number(rest); rest = ""; }
    if (rest) return NaN;
    return Math.round(neg ? -total : total);
  }
  const kindWord = v => { const s = String(v || "").trim(); return /^고정/.test(s) ? "fixed" : /^(변동|지출|생활비)/.test(s) ? "expense" : ""; };

  // 텍스트 → 줄과 칸 (탭 > 쉼표(따옴표 지원) > 칸 없음)
  function textToRows(text) {
    const lines = String(text).replace(/^﻿/, "").split(/\r?\n/).filter(l => l.trim());
    if (lines.some(l => l.includes("\t"))) return lines.map(l => l.split("\t"));
    // 52,000 같은 금액 속 쉼표는 빼고, 그래도 쉼표가 있으면 CSV로 본다
    if (lines.some(l => l.replace(/\d,(?=\d{3}(\D|$))/g, "").includes(","))) {
      return lines.map(line => {
        const out = []; let cur = "", q = false;
        for (let i = 0; i < line.length; i++) {
          const ch = line[i];
          if (q) { if (ch === '"' && line[i + 1] === '"') { cur += '"'; i++; } else if (ch === '"') q = false; else cur += ch; }
          else if (ch === '"') q = true; else if (ch === ",") { out.push(cur); cur = ""; } else cur += ch;
        }
        out.push(cur);
        // "52,000"처럼 따옴표 없이 쉼표가 들어간 금액은 다시 붙인다
        return out.reduce((a, c) => { const prev = a[a.length - 1]; if (prev != null && /^-?\d{1,3}(,\d{3})*$/.test(prev) && /^\d{3}(원)?$/.test(c.trim())) a[a.length - 1] = prev + "," + c; else a.push(c); return a; }, []);
      });
    }
    return lines.map(l => [l]);
  }

  // 머리글 없는 줄: 칸(또는 낱말)마다 생김새로 뜻을 짐작한다
  function guessRow(cells) {
    const toks = cells.length === 1 ? String(cells[0]).trim().split(/\s+/) : cells;
    const r = { names: [], full: [] };
    for (let i = 0; i < toks.length; i++) {
      let t = toks[i]; const s = String(t ?? "").trim();
      if (!s && typeof t !== "number" && !(t instanceof Date)) continue;
      // "매월 25일" / "11월 3일"처럼 두 낱말로 나뉜 날짜를 합쳐 본다
      if (cells.length === 1 && i + 1 < toks.length && /^(매월|매달|매년|\d{1,2}월)$/.test(s)) {
        const joined = s + " " + toks[i + 1];
        if (/^(매월|매달)/.test(s) && parseDay(joined)) { r.cycle = r.cycle || "monthly"; r.day = parseDay(joined); i++; continue; }
        if (/^매년/.test(s)) { r.cycle = "yearly"; const d2 = parseDate(toks[i + 1] + (toks[i + 2] ? " " + toks[i + 2] : "")); if (d2) { r.date = d2; i += toks[i + 2] && /일$/.test(toks[i + 2]) ? 2 : 1; } continue; }
        const d2 = parseDate(joined); if (d2 && !r.date) { r.date = d2; i++; continue; }
      }
      if (!r.kind && kindWord(s) && s.length <= 4) { r.kind = kindWord(s); continue; }
      if (/^(매월|매달)$/.test(s)) { r.cycle = r.cycle || "monthly"; continue; }
      if (/^매년$/.test(s)) { r.cycle = "yearly"; continue; }
      if (/^(매월|매달)\s*\d{1,2}\s*일?$|^말일$/.test(s)) { r.cycle = r.cycle || "monthly"; r.day = parseDay(s); continue; }
      if (!r.date && (t instanceof Date || (typeof t === "number" && t > 20000 && t < 80000 && r.amountRaw != null) || (/^[\d.\-/년월일\s()]+$/.test(s) && parseDate(s)))) {
        const d = parseDate(t); if (d) { r.date = d; continue; }
      }
      if (!r.day && /^\d{1,2}일$/.test(s)) { r.day = parseDay(s); continue; }
      if (r.amountRaw == null && (typeof t === "number" || /^[-(₩]?[\d,.]+(원|만|천|억)?[)]?$|^\d+(\.\d+)?(억|천만|만|천)/.test(s))) {
        const a = parseAmount(t);
        if (Number.isFinite(a) && (Math.abs(a) >= 100 || /원|만|천|억|₩|,/.test(s))) { r.amountRaw = a; continue; }
      }
      if (!r.category && CATS.includes(s)) { r.category = s; r.full.push(s); continue; }
      if (!r.who && WHO_WORDS[s]) r.who = parseWho(s);
      r.names.push(s); r.full.push(s);
    }
    return { kind: r.kind, date: r.date, day: r.day, cycle: r.cycle, amount: r.amountRaw, category: r.category, who: r.who || [], name: r.names.join(" "), fullName: r.full.join(" "), memo: "" };
  }

  // 표(줄 배열) → 미리보기 줄 목록
  function rowsToItems(rows, mode) {
    rows = rows.map(r => r.map(c => (typeof c === "string" ? c.trim() : c))).filter(r => r.some(c => c !== "" && c != null));
    let hdrAt = -1, map = null;
    for (let i = 0; i < Math.min(rows.length, 25); i++) {
      const m = headerMap(rows[i]);
      if (m.amount != null && Object.keys(m).length >= 2) { hdrAt = i; map = m; break; }
    }
    const body = hdrAt >= 0 ? rows.slice(hdrAt + 1) : rows;
    const out = [];
    for (const cells of body) {
      let raw;
      if (map) {
        const g = k => (map[k] != null ? cells[map[k]] : "");
        const dateCell = g("date");
        const cyc = String(g("cycle") || "") + " " + (typeof dateCell === "string" ? dateCell : "");
        raw = {
          kind: kindWord(g("kind")), date: parseDate(dateCell), day: parseDay(dateCell),
          cycle: /매년|연/.test(cyc) ? "yearly" : /매월|매달|월/.test(String(g("cycle") || "")) || /^(매월|매달)/.test(String(dateCell)) ? "monthly" : "",
          amount: parseAmount(g("amount")), category: String(g("category") || ""), who: parseWho(g("who")),
          name: String(g("name") ?? "").trim(), memo: String(g("memo") ?? "").trim(),
        };
        if (!g("amount") && g("amount") !== 0) raw.amount = NaN;
      } else raw = guessRow(cells);
      out.push(buildItem(raw, mode, cells));
    }
    return { items: out, header: hdrAt >= 0 };
  }

  function buildItem(r, mode, cells) {
    const src = cells.map(c => (c instanceof Date ? str(Math.round(Date.UTC(c.getFullYear(), c.getMonth(), c.getDate()) / DAY)) : String(c ?? ""))).filter(Boolean).join(" · ").slice(0, 120);
    let kind = mode !== "auto" ? mode : r.kind || (r.cycle || (r.day && !r.date) ? "fixed" : "expense");
    const it = { kind, src, ok: true, why: "", use: true };
    const amount = r.amount;
    if (!Number.isFinite(amount)) { it.ok = false; it.why = "금액을 못 찾았어요"; }
    else if (amount < 0) { it.ok = false; it.why = "취소·환불(마이너스) 금액이라 뺐어요"; }
    else if (amount === 0) { it.ok = false; it.why = "금액이 0원이에요"; }
    else if (amount > 1e10) { it.ok = false; it.why = "금액이 너무 커요"; }
    const category = guessCat(r.category, r.name, r.memo);
    const extraCat = r.category && !CATS.includes(r.category) ? r.category : "";
    if (kind === "expense") {
      const d = r.date;
      if (it.ok && !d) { it.ok = false; it.why = "날짜를 못 찾았어요"; }
      const memo = [r.name, r.memo, extraCat && !r.name ? extraCat : ""].filter(Boolean).join(" ").slice(0, 100);
      it.body = { date: d ? `${d.y}-${pad(d.m)}-${pad(d.d)}` : "", amount: Math.max(0, amount || 0), category, who: r.who || [], memo };
      if (it.ok && state.expenses.some(e => e.date === it.body.date && e.amount === it.body.amount && (e.memo || "") === memo)) { it.dup = true; it.use = false; it.why = "이미 있는 기록 같아요"; }
    } else {
      const cycle = r.cycle === "yearly" ? "yearly" : "monthly";
      const d = r.date;
      const day = r.day || (d ? d.d : 0) || 1;
      const name = (r.fullName || r.name || r.memo || extraCat || category).slice(0, 40);
      const from = d && d.hasYear ? ymOf(d.y, d.m) : ymOf(NOW_Y, NOW_M);
      it.body = { name, amount: Math.max(0, amount || 0), category, cycle, day, payMonth: cycle === "yearly" ? (d ? d.m : NOW_M) : NOW_M, from, to: "", who: r.who || [], memo: r.name && r.memo ? r.memo.slice(0, 200) : "" };
      if (it.ok && state.fixed.some(f => f.name === name && f.amount === it.body.amount && f.cycle === cycle)) { it.dup = true; it.use = false; it.why = "이미 있는 고정비 같아요"; }
    }
    if (!it.ok) it.use = false;
    return it;
  }

    [monthly, months, rate].forEach(i => i.addEventListener("input", sync));
    sync();
    const saveBtn = el("button", { type: "submit", class: "btn primary" }, isNew ? "추가하기" : "저장");
    const form = el("form", { class: "form", novalidate: true },
      el("div", { class: "field" }, el("span", { class: "lbl" }, "종류"), el("div", { class: "who" }, kindBtns), hint),
      el("div", { class: "row2" }, field("a-name", "이름", name), field("a-owner", "누구 것", owner)),
      amountField, savingBox,
      field("a-memo", "메모", memo),
      err, slot,
      el("div", { class: "actions" },
        isNew ? null : el("button", { type: "button", class: "btn danger", onclick: () => confirmBox(slot, `‘${d.name}’ 자산을 삭제할까요? 순자산 추이에서도 빠져요.`, async () => {
          try { await api("DELETE", a.id, null, "/api/assets"); await refresh(); close(); } catch (e) { err.textContent = writeError(e); }
        }) }, "삭제"),
        el("span", { class: "spacer" }),
        el("button", { type: "button", class: "btn", onclick: close }, "닫기"), saveBtn));
    form.addEventListener("submit", async e => {
      e.preventDefault();
      const isAuto = kind === "saving" && auto.checked;
      const b = { name: name.value.trim(), kind, owner: owner.value, amount: isAuto ? 0 : moneyVal(amount), memo: memo.value.trim() };
      if (kind === "saving") Object.assign(b, { monthly: moneyVal(monthly), start: start.value, months: Number(months.value) || 0, rate: Number(rate.value) || 0, auto: isAuto });
      if (!b.name) { err.textContent = "이름을 적어 주세요."; name.focus(); return; }
      if (isAuto && (!b.monthly || !b.start)) { err.textContent = "매달 넣는 돈과 시작 달을 넣어 주세요."; monthly.focus(); return; }
      if (!isAuto && !b.amount) { err.textContent = "금액을 적어 주세요."; amount.focus(); return; }
      if (rate.value && !(Number(rate.value) >= 0 && Number(rate.value) <= 30)) { err.textContent = "금리는 0–30 사이 숫자로 적어 주세요."; rate.focus(); return; }
      b.history = { ...(d.history || {}) };
      if (!isAuto) b.history[NOW_YM] = b.amount;
      saveBtn.disabled = true; err.textContent = "";
      try { await saveTo("/api/assets", a, b); close(); } catch (e2) { err.textContent = writeError(e2); saveBtn.disabled = false; }
    });
    body.append(form);
    setTimeout(() => name.focus(), 30);
  }

  function renderAll() {
    renderFilters();
    renderMonth($("cal0"), state.year, state.month);
    const [y2, m2] = addMonth(state.year, state.month, 1);
    renderMonth($("cal1"), y2, m2);
    renderDay();
    renderBudget();
    renderAssets();
    $("fab").hidden = !state.canWrite;
  }

  // ---------- 편집 창 ----------
  function openEditor(ev, dateStr) {
    if (!state.canWrite) return;
    const isNew = !ev;
    const data = ev ? { ...ev } : { title: "", who: ["romi"], start: dateStr || state.sel, end: "", time: "", repeat: "none", until: "", memo: "", exdates: [] };
    const who = new Set(data.who || []);
    let confirmBox = null;

    const root = $("modalRoot");
    const close = () => { root.replaceChildren(); document.removeEventListener("keydown", onKey); };
    const onKey = e => { if (e.key === "Escape") close(); };
    document.addEventListener("keydown", onKey);

    const title = el("input", { type: "text", id: "f-title", maxlength: "80", placeholder: "예: 로미 소아과 진료", value: data.title });
    const start = el("input", { type: "date", id: "f-start", value: data.start, required: true });
    const end = el("input", { type: "date", id: "f-end", value: data.end && data.end !== data.start ? data.end : "" });
    const time = el("input", { type: "time", id: "f-time", value: data.time || "" });
    const repeat = el("select", { id: "f-repeat" }, Object.entries(REPEAT_LABEL).map(([v, l]) => el("option", { value: v, selected: data.repeat === v }, l)));
    const until = el("input", { type: "date", id: "f-until", value: data.until || "" });
    const untilWrap = el("div", { class: "field" }, el("label", { for: "f-until" }, "반복 종료일 (선택)"), until);
    const memo = el("textarea", { id: "f-memo", maxlength: "500", placeholder: "병원 이름, 준비물 등" });
    memo.value = data.memo || "";
    const err = el("div", { class: "err", role: "alert" });
    const syncUntil = () => { untilWrap.hidden = repeat.value === "none"; };
    repeat.addEventListener("change", syncUntil); syncUntil();

    const whoBtns = PEOPLE.map(p => {
      const b = el("button", { type: "button", class: "pick", style: `--c:${p.c};--cs:${p.cs}`, "aria-pressed": String(who.has(p.id)) }, el("span", { class: "dot" }), p.name);
      b.addEventListener("click", () => { who.has(p.id) ? who.delete(p.id) : who.add(p.id); b.setAttribute("aria-pressed", String(who.has(p.id))); });
      return b;
    });
    const allBtn = el("button", { type: "button", class: "pick", style: "--c:var(--fam);--cs:var(--fam-soft)", "aria-pressed": "false",
      onclick: () => { PEOPLE.forEach(p => who.add(p.id)); whoBtns.forEach(b => b.setAttribute("aria-pressed", "true")); } }, el("span", { class: "dot" }), "가족 모두");

    const presets = el("div", { class: "presets" }, ROMI_PRESETS.map(t => el("button", { type: "button", class: "preset", onclick: () => {
      title.value = `로미 ${t}`;
      who.clear(); who.add("romi"); whoBtns.forEach((b, i) => b.setAttribute("aria-pressed", String(PEOPLE[i].id === "romi")));
      if (t === "생일") repeat.value = "yearly";
      syncUntil(); title.focus();
    } }, t)));

    const isRepeat = !isNew && data.repeat && data.repeat !== "none";
    const saveBtn = el("button", { type: "submit", class: "btn primary" }, isNew ? "추가하기" : "저장");
    const actions = el("div", { class: "actions" },
      isNew ? null : el("button", { type: "button", class: "btn danger", onclick: () => showConfirm() }, "삭제"),
      el("span", { class: "spacer" }),
      el("button", { type: "button", class: "btn", onclick: close }, "닫기"),
      saveBtn);

    const confirmSlot = el("div");
    function showConfirm() {
      if (confirmBox) return;
      confirmBox = el("div", { class: "confirm" },
        el("p", {}, isRepeat ? "반복 일정이에요. 어떻게 삭제할까요? 삭제하면 가족 모두의 달력에서 사라져요." : `‘${data.title}’ 일정을 삭제할까요? 가족 모두의 달력에서 사라져요.`),
        el("div", { class: "actions" },
          el("button", { type: "button", class: "btn", onclick: () => { confirmBox.remove(); confirmBox = null; } }, "취소"),
          isRepeat ? el("button", { type: "button", class: "btn danger", onclick: () => doDelete("one") }, `${Number(dateStr.slice(5, 7))}/${Number(dateStr.slice(8))} 하루만 삭제`) : null,
          el("button", { type: "button", class: "btn danger solid", onclick: () => doDelete("all") }, isRepeat ? "반복 전체 삭제" : "삭제")));
      confirmSlot.append(confirmBox);
    }
    async function doDelete(mode) {
      try {
        if (mode === "one") await api("PUT", ev.id, { ...ev, exdates: Array.from(new Set([...(data.exdates || []), dateStr])) });
        else await api("DELETE", ev.id);
        refresh();
        close();
      } catch (e) { err.textContent = writeError(e); }
    }

    const form = el("form", { class: "form", novalidate: true },
      el("div", { class: "field" }, el("label", { for: "f-title" }, "일정 이름"), title),
      el("div", { class: "field" }, el("span", { class: "lbl" }, "로미 일정 빠른 입력"), presets),
      el("div", { class: "field" }, el("span", { class: "lbl" }, "누구 일정인가요?"), el("div", { class: "who" }, whoBtns, allBtn)),
      el("div", { class: "row2" },
        el("div", { class: "field" }, el("label", { for: "f-start" }, "날짜"), start),
        el("div", { class: "field" }, el("label", { for: "f-end" }, "끝나는 날 (여러 날일 때)"), end)),
      el("div", { class: "row2" },
        el("div", { class: "field" }, el("label", { for: "f-time" }, "시간 (비우면 종일)"), time),
        el("div", { class: "field" }, el("label", { for: "f-repeat" }, "반복"), repeat)),
      untilWrap,
      el("div", { class: "field" }, el("label", { for: "f-memo" }, "메모"), memo),
      err, confirmSlot, actions);

    form.addEventListener("submit", async e => {
      e.preventDefault();
      const t = title.value.trim();
      if (!t) { err.textContent = "일정 이름을 적어 주세요."; title.focus(); return; }
      if (!who.size) { err.textContent = "누구 일정인지 한 명 이상 골라 주세요."; return; }
      if (!start.value) { err.textContent = "날짜를 골라 주세요."; return; }
      if (end.value && end.value < start.value) { err.textContent = "끝나는 날이 시작 날짜보다 빨라요."; return; }
      if (repeat.value !== "none" && until.value && until.value < start.value) { err.textContent = "반복 종료일이 시작 날짜보다 빨라요."; return; }
      const body = {
        title: t, who: PEOPLE.map(p => p.id).filter(id => who.has(id)),
        start: start.value, end: end.value || start.value, time: time.value || "",
        repeat: repeat.value, until: repeat.value !== "none" ? (until.value || "") : "",
        memo: memo.value.trim(), exdates: isNew ? [] : (data.exdates || []), updatedAt: Date.now(),
      };
      saveBtn.disabled = true; err.textContent = "";
      try {
        if (isNew) await api("POST", null, body);
        else await api("PUT", ev.id, { ...body, createdAt: ev.createdAt || Date.now() });
        await refresh();
        state.sel = body.start;
        if (!inShown(body.start)) { const [y, m] = body.start.split("-").map(Number); state.year = y; state.month = m; }
        close(); renderAll();
      } catch (e2) { err.textContent = writeError(e2); saveBtn.disabled = false; }
    });

    const scrim = el("div", { class: "scrim", onclick: e => { if (e.target === scrim) close(); } },
      el("div", { class: "sheet", role: "dialog", "aria-modal": "true", "aria-label": isNew ? "일정 추가" : "일정 수정" },
        el("div", { class: "sheet-head" }, el("h3", {}, isNew ? "새 일정 추가" : "일정 수정")), form));
    root.replaceChildren(scrim);
    setTimeout(() => title.focus(), 30);
  }

  function writeError(e) {
    if (e && e.status === 401) { logout(); return "가족 비밀번호가 바뀌었어요. 다시 들어와 주세요."; }
    if (e && e.message) return e.message;
    return "저장하지 못했어요. 인터넷 연결을 확인하고 다시 시도해 주세요.";
  }

  // ---------- 이동 ----------
  const shift = n => { [state.year, state.month] = addMonth(state.year, state.month, n); renderAll(); };
  $("prev").onclick = () => shift(-1);
  $("next").onclick = () => shift(1);
  $("todayBtn").onclick = () => { state.year = now.getFullYear(); state.month = now.getMonth() + 1; state.sel = TODAY; renderAll(); };
  $("fab").onclick = () => openEditor(null, state.sel);

  renderAll();

  // ---------- 서버 저장소 (/api/events) ----------
  const status = $("status");
  const setStatus = (t, warn) => { status.textContent = t; status.classList.toggle("warn", !!warn); };
  const KEY_STORE = "rom.key";
  let familyKey = load(KEY_STORE, "");

  async function api(method, id, body, path = "/api/events") {
    const r = await fetch(path + (id ? `?id=${encodeURIComponent(id)}` : ""), {
      method,
      headers: { "x-family-key": familyKey, ...(body ? { "Content-Type": "application/json" } : {}) },
      body: body ? JSON.stringify(body) : undefined,
    });
    let j = {};
    try { j = await r.json(); } catch {}
    if (!r.ok) { const e = new Error(j.message || "요청이 실패했어요."); e.status = r.status; throw e; }
    return j;
  }

  const normalize = v => ({
    id: String(v.id), title: String(v.title || "(제목 없음)"), who: Array.isArray(v.who) ? v.who : ["romi"],
    start: String(v.start || TODAY), end: String(v.end || v.start || TODAY), time: String(v.time || ""),
    repeat: String(v.repeat || "none"), until: String(v.until || ""), memo: String(v.memo || ""),
    exdates: Array.isArray(v.exdates) ? v.exdates.map(String) : [], createdAt: v.createdAt,
  });

  let refreshing = null;
  function refresh() {
    if (!familyKey) return Promise.resolve();
    if (refreshing) return refreshing;
    refreshing = (async () => {
      try {
        const [{ events }, { fixed }, { expenses }, { assets }] = await Promise.all([
          api("GET"), api("GET", null, null, "/api/fixed"), api("GET", null, null, "/api/expenses"), api("GET", null, null, "/api/assets")]);
        state.assets = (assets || []).map(normAsset).filter(a => a.name);
        state.fixed = (fixed || []).map(normFixed);
        state.expenses = (expenses || []).map(normExp).filter(e => /^\d{4}-\d{2}-\d{2}$/.test(e.date) && e.amount > 0);
        state.events = (events || []).map(normalize).filter(e => /^\d{4}-\d{2}-\d{2}$/.test(e.start));
        state.loaded = true; state.canWrite = true;
        const t = new Date();
        if (state.storage === "missing" || state.storage === "error") { setStatus("⚠ 저장소(DB)가 연결되지 않았어요. 지금은 저장이 안 돼요. Vercel의 Storage에서 Upstash를 rom-calendar에 연결하고 다시 배포해 주세요.", true); renderAll(); return; }
        setStatus(`가족 일정 ${state.events.length}개 · 고정비 ${state.fixed.length}개 · 지출 ${state.expenses.length}건 · ${pad(t.getHours())}:${pad(t.getMinutes())} 기준 · 가족이 바꾼 내용은 잠시 뒤 자동으로 보여요`);
        renderAll();
      } catch (e) {
        if (e.status === 401) logout();
        else setStatus(e.status ? e.message : "서버에 연결하지 못했어요. 인터넷 연결을 확인해 주세요.", true);
      } finally { refreshing = null; }
    })();
    return refreshing;
  }

  function logout() {
    familyKey = ""; save(KEY_STORE, "");
    state.events = []; state.fixed = []; state.expenses = []; state.assets = []; state.canWrite = false; state.loaded = false;
    renderAll(); showLogin();
  }

  function showLogin(msg) {
    setStatus("가족 비밀번호를 넣으면 일정이 보여요. 공휴일은 지금도 볼 수 있어요.");
    const input = el("input", { type: "password", id: "f-key", autocomplete: "current-password", placeholder: "가족 비밀번호" });
    const err = el("div", { class: "err", role: "alert" }, msg || "");
    const btn = el("button", { type: "submit", class: "btn primary" }, "들어가기");
    const form = el("form", { class: "form" },
      el("p", { class: "login-lead" }, "아빠·엄마·로미의 일정은 가족만 볼 수 있어요."),
      el("div", { class: "field" }, el("label", { for: "f-key" }, "가족 비밀번호"), input),
      err,
      el("div", { class: "actions" }, el("button", { type: "button", class: "btn", onclick: () => $("modalRoot").replaceChildren() }, "공휴일만 볼게요"), btn));
    form.addEventListener("submit", async e => {
      e.preventDefault();
      if (!input.value) { err.textContent = "비밀번호를 넣어 주세요."; return; }
      btn.disabled = true; err.textContent = "";
      familyKey = input.value;
      try {
        await api("GET");
        save(KEY_STORE, familyKey);
        $("modalRoot").replaceChildren();
        await refresh();
      } catch (e2) {
        familyKey = "";
        err.textContent = e2.status ? e2.message : "서버에 연결하지 못했어요. 인터넷 연결을 확인해 주세요.";
        btn.disabled = false; input.select();
      }
    });
    $("modalRoot").replaceChildren(el("div", { class: "scrim" },
      el("div", { class: "sheet login", role: "dialog", "aria-modal": "true", "aria-label": "가족 비밀번호" },
        el("div", { class: "sheet-head" }, el("h3", {}, "로미네 가족 캘린더")), form)));
    setTimeout(() => input.focus(), 30);
  }

  // 저장소 상태 (missing/error면 상태줄에 경고)
  fetch("/api/health").then(r => r.json()).then(j => { state.storage = j.storage; if (j.storage === "missing" || j.storage === "error") refresh(); }).catch(() => {});
  if (familyKey) { setStatus("가족 일정을 불러오는 중…"); refresh(); } else { state.loaded = true; renderAll(); showLogin(); }
  // 다른 가족이 바꾼 내용을 가져오기: 화면이 보일 때 30초마다, 그리고 다시 돌아왔을 때
  setInterval(() => { if (document.visibilityState === "visible") refresh(); }, 30000);
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") refresh(); });
})();
</script>
</body>
</html>
